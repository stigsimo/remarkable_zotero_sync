[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-sync"
version = "0.1.0"
description = "Public Zotero to reMarkable sync tool"
readme = {file = "instructions.txt", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.scripts]
zotero-sync = "remarkable_zotero_sync.cli:main"

[tool.setuptools.packages.find]
include = ["remarkable_zotero_sync*"]
